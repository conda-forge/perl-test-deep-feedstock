{% set name = "perl-test-deep" %}
{% set version = "1.205" %}
{% set sha256 = "42781e9943a7a215e662c4973b9feafdc019fd16469bdb849a8537ee58956273" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/R/RJ/RJBS/Test-Deep-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
  run:
    - perl

test:
  imports:
    - Test::Deep
    - Test::Deep::All
    - Test::Deep::Any
    - Test::Deep::Array
    - Test::Deep::ArrayEach
    - Test::Deep::ArrayElementsOnly
    - Test::Deep::ArrayLength
    - Test::Deep::ArrayLengthOnly
    - Test::Deep::Blessed
    - Test::Deep::Boolean
    - Test::Deep::Cache
    - Test::Deep::Cache::Simple
    - Test::Deep::Class
    - Test::Deep::Cmp
    - Test::Deep::Code
    - Test::Deep::Hash
    - Test::Deep::HashEach
    - Test::Deep::HashElements
    - Test::Deep::HashKeys
    - Test::Deep::HashKeysOnly
    - Test::Deep::Ignore
    - Test::Deep::Isa
    - Test::Deep::ListMethods
    - Test::Deep::MM
    - Test::Deep::Methods
    - Test::Deep::NoTest
    - Test::Deep::None
    - Test::Deep::Number
    - Test::Deep::Obj
    - Test::Deep::Ref
    - Test::Deep::RefType
    - Test::Deep::Regexp
    - Test::Deep::RegexpMatches
    - Test::Deep::RegexpOnly
    - Test::Deep::RegexpRef
    - Test::Deep::RegexpRefOnly
    - Test::Deep::RegexpVersion
    - Test::Deep::ScalarRef
    - Test::Deep::ScalarRefOnly
    - Test::Deep::Set
    - Test::Deep::Shallow
    - Test::Deep::Stack
    - Test::Deep::String
    # These seem to be "internal use only" style packages that
    # shouldn't be directly imported.
    #- Test::Deep::SubHash
    #- Test::Deep::SubHashElements
    #- Test::Deep::SubHashKeys
    #- Test::Deep::SubHashKeysOnly
    #- Test::Deep::SuperHash
    #- Test::Deep::SuperHashElements
    #- Test::Deep::SuperHashKeys
    #- Test::Deep::SuperHashKeysOnly

about:
  home: https://metacpan.org/dist/Test-Deep
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'Extremely flexible deep comparison'
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod

extra:
  recipe-maintainers:
    - cbrueffer
